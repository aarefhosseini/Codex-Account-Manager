name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install build tools
        run: python -m pip install -r electron/requirements-python-core.txt
      - name: Install desktop dependencies
        working-directory: electron
        run: npm ci
      - name: Test desktop code
        working-directory: electron
        run: npm test
      - name: Build Windows x64 installer and verify bundled core
        working-directory: electron
        env:
          CAM_ELECTRON_PYTHON: python
        run: npm run dist:win -- --x64 --publish never
      - name: Verify installer and packaged runtime are Windows x64 binaries
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem electron/dist/*-x64.exe -File)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $core = 'electron/dist/win-unpacked/resources/core/codex-account.exe'
          $report = & $core doctor --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $report.core.installed) { throw 'Packaged core failed its doctor check' }
          $version = (Get-Content electron/package.json -Raw | ConvertFrom-Json).version
          if ($report.core.version -ne $version) { throw 'Packaged version differs from the installer version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          Get-FileHash $installer[0].FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: electron/dist/*-x64.exe
          if-no-files-found: error
